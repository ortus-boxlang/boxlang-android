/**
 * BoxLang Android Simulator — plain-JVM development server.
 *
 * Starts an embedded HTTP server that dispatches requests through the same MVC stack
 * (MVCDispatcher / ViewRenderer / Router) used on the device.  Developers can iterate
 * on BoxLang templates and handler logic without Android Studio or a physical device.
 *
 * Usage:
 *   gradle :simulator:run --args="--app ../android-sample-web/src/main/bx --port 8085"
 *
 * The non-Android MVC and AOT source packages (aot/*, mvc/*) are compiled directly from
 * the library's src/main/java tree — no code duplication and no Android SDK required.
 *
 * All unit tests (MVC + AOT) are wired into this project's test source set so they run
 * on a plain JVM without the Android SDK:
 *
 *   gradle :simulator:test
 */
plugins {
	id 'application'
	id 'de.undercouch.download' version '5.7.0'
}

repositories {
	mavenCentral()
}

def boxlangJar = rootProject.file( "libs/boxlang-${boxlangVersion}.jar" )

dependencies {
	implementation files( boxlangJar )
	implementation 'org.slf4j:slf4j-api:2.0.18'
	implementation 'org.ow2.asm:asm:9.9.1'
	runtimeOnly 'ch.qos.logback:logback-classic:1.5.32'

	// ── Unit tests ────────────────────────────────────────────────────────────
	// Shared by all test classes: MVC (Router, MVCDispatcher, ViewRenderer …)
	// and AOT pipeline (BXCompiler, BoxClassExtractor, ModuleArchiver).
	testImplementation "org.junit.jupiter:junit-jupiter:6.+"
	testImplementation "com.google.truth:truth:1.4.4"
	testRuntimeOnly   "org.junit.platform:junit-platform-launcher"
	testRuntimeOnly   'ch.qos.logback:logback-classic:1.5.32'
}

application {
	mainClass = 'ortus.boxlang.runtime.android.simulator.BoxLangSimulator'
}

java {
	sourceCompatibility = JavaVersion.toVersion( jdkVersion )
	targetCompatibility = JavaVersion.toVersion( jdkVersion )
}

// ── Source sets ───────────────────────────────────────────────────────────────

// Pull the non-Android packages from the library's source tree (pure JVM, no android.* imports).
compileJava {
	source(
		fileTree( "${rootProject.projectDir}/src/main/java" ) {
			include 'ortus/boxlang/runtime/android/aot/**'
			include 'ortus/boxlang/runtime/android/mvc/**'
		}
	)
}

// Wire the library's test sources and resources into this project so all MVC/AOT
// unit tests run here with: gradle :simulator:test
sourceSets {
	test {
		java {
			srcDir "${rootProject.projectDir}/src/test/java"
		}
		resources {
			srcDir "${rootProject.projectDir}/src/test/resources"
		}
	}
}

// Bundle the framework's core BX files (bxandroid/system/*.bx) onto the simulator's
// classpath so BoxLangSimulator can extract them at boot and register the /bxandroid mapping.
// We include ONLY the bxandroid/ subtree — the META-INF/services/ files (which select
// PreloadedBoxpiler on Android) are deliberately excluded so tests keep using ASMBoxpiler.
processResources {
	from( fileTree( "${rootProject.projectDir}/src/main/resources" ) {
		include 'bxandroid/**'
	})
}

// Re-use the root project's downloadBoxLang task; the JAR lands in <root>/libs/ which both
// the library build and the simulator reference.
compileJava.dependsOn ':downloadBoxLang'

// ── Test task ────────────────────────────────────────────────────────────────

test {
	useJUnitPlatform()

	// AOT pipeline tests use Paths.get("src/test/resources/...") — set the working directory
	// to the root project so those relative paths resolve correctly.
	workingDir = rootProject.projectDir
}
