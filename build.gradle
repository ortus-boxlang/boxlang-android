/**
 * BoxLang Android Runtime — AAR library.
 *
 * Contains the Android-specific runtime glue (bootstrap, Application/Activity, WebView
 * renderer, lifecycle dispatcher) AND the portable front-controller MVC framework (Router,
 * RoutingService, MVCDispatcher, ViewRenderer, AOT pipeline).
 *
 * 100% Java — no Kotlin. The UI track is a WebView: BoxLang .bxm templates rendered to HTML
 * and loaded into a WebView via BoxWebViewRenderer.
 *
 * BoxLang core is NOT bundled in the AAR — it is declared compileOnly so the consuming app
 * provides it (typically the slim NoOp distribution, since ART cannot defineClass() raw JVM
 * bytecode at runtime). Run `./gradlew downloadBoxLang` (or let preBuild do it) to pull the
 * snapshot JAR before compiling.
 */
plugins {
	id 'com.android.library' version '8.7.3'
	id 'de.undercouch.download' version '5.7.0'
	id 'de.mannodermaus.android-junit5' version '1.10.0.0'
	id 'maven-publish'
}

repositories {
	google()
	mavenCentral()
}

android {
	namespace 'ortus.boxlang.runtime.android'
	compileSdk 35

	defaultConfig {
		minSdk 26					// InMemoryDexClassLoader (hot-reload) requires API 26+
		consumerProguardFiles 'consumer-rules.pro'
	}

	compileOptions {
		sourceCompatibility JavaVersion.VERSION_17
		targetCompatibility JavaVersion.VERSION_17
		// Library desugaring lets D8/R8 dex Java 17/21 APIs BoxLang core uses.
		coreLibraryDesugaringEnabled true
	}

	buildTypes {
		release {
			minifyEnabled true
			proguardFiles getDefaultProguardFile( 'proguard-android-optimize.txt' ), 'proguard-rules.pro'
		}
	}

	testOptions {
		unitTests {
			includeAndroidResources = true
			returnDefaultValues  = true
		}
	}
}

// ─── BoxLang JAR (downloaded before compilation) ──────────────────────────────

def boxlangJar = file( "libs/boxlang-${boxlangVersion}.jar" )

dependencies {
	// BoxLang core — provided by the consumer (NoOp slim distribution on device).
	// compileOnly keeps it out of the AAR; testImplementation makes it available for unit tests.
	compileOnly files( boxlangJar )
	testImplementation files( boxlangJar )

	// Java 8+ API desugaring for ART
	coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'

	// SLF4J API (used by the MVC / AOT layer)
	implementation 'org.slf4j:slf4j-api:2.0.18'

	// ASM — BoxClassExtractor reads class internal names from AOT output
	implementation 'org.ow2.asm:asm:9.9.1'

	// AndroidX
	implementation 'androidx.appcompat:appcompat:1.7.0'

	// ── Unit tests ────────────────────────────────────────────────────────────
	// JUnit 4 + Robolectric for Android-specific tests
	testImplementation 'junit:junit:4.13.2'
	testImplementation 'org.robolectric:robolectric:4.13'
	testImplementation 'androidx.test:core:1.6.1'

	// JUnit 5 for the pure-JVM MVC / AOT tests (via android-junit5 plugin)
	testImplementation "org.junit.jupiter:junit-jupiter:6.+"
	testImplementation "org.mockito:mockito-core:5.+"
	testImplementation "com.google.truth:truth:1.4.4"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
	testRuntimeOnly 'ch.qos.logback:logback-classic:1.5.32'
}

// ─── Download task ────────────────────────────────────────────────────────────

task downloadBoxLang( type: Download ) {
	doFirst {
		file( "libs" ).mkdirs()
	}
	src "https://downloads.ortussolutions.com/ortussolutions/boxlang/${boxlangVersion}/boxlang-${boxlangVersion}.jar"
	dest file( "libs/boxlang-${boxlangVersion}.jar" )
	overwrite true
	onlyIfModified true
}

// Ensure BoxLang is present before any compilation or test task runs.
preBuild.dependsOn downloadBoxLang

// ─── AAR Publication ──────────────────────────────────────────────────────────

afterEvaluate {
	publishing {
		publications {
			release( MavenPublication ) {
				from components.release
				groupId    = project.group
				artifactId = 'boxlang-android'
				version    = project.version
			}
		}
		repositories {
			maven {
				name = 'localRepo'
				url  = layout.buildDirectory.dir( 'repo' )
			}
		}
	}
}
